% ============================================================
% IWR6843ISK-ODS mmWave 센서 설정 (.cfg)
% ============================================================
% 이 파일은 TI mmWave Demo Visualizer (https://dev.ti.com/gallery/ - "mmWave
% Demo Visualizer" 도구)에서 IWR6843ISK-ODS + Enhanced Point Cloud(TLV 1006)
% 출력을 활성화한 펌웨어 데모로 생성한 .cfg를 그대로 붙여넣어 사용해야 한다.
% 아래 값은 radar/capture.py에 있던 기존 하드코딩 예시값을 옮겨온 것으로,
% 실제 안테나 구성/캘리브레이션과 정확히 일치하는지 검증되지 않았다.
% *** 실제 보드에 연결하기 전에 Demo Visualizer로 새로 export 한 .cfg로
% *** 이 파일을 교체할 것. (메뉴: Target Configuration -> Send Configuration
% *** to Target 이전에 "Save Configuration"으로 .cfg 저장)
%
% % 로 시작하는 줄과 빈 줄은 radar/capture.py에서 무시된다.

sensorStop
flushCfg
profileCfg 0 60 411 7 57 0 0 70 1 256 5209 0 0 158
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 16 0 100 1 0
guiMonitor -1 1 0 0 0 0 0
cfarCfg -1 0 2 8 4 3 0 15.0 0
cfarCfg -1 1 0 4 2 3 1 15.0 0
multiObjBeamForming -1 1 0.5
calibDcRangeSig -1 0 -5 8 256
extendedMaxVelocity -1 0
sensorStart
